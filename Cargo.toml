[workspace]
members = [
    "crates/tomlsmith",
    "crates/tomlsmith-cli",
    "crates/tomlsmith-lsp",
    "tools/toml-test/decoder",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Nirvana-Jie <1357711537@qq.com>"]
repository = "https://github.com/tomlsmith/tomlsmith"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
rowan = "0.17.0"
serde_json = "1.0"
text-size = "1.1.1"
thiserror = "2.0.20"
tomlsmith = { path = "crates/tomlsmith" }
ungrammar = "1.16.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
