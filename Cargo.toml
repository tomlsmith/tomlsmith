[workspace]
members = [
    "crates/tomlsmith",
    "crates/tomlsmith-cli",
    "crates/tomlsmith-lsp",
    "tools/complexity-guards",
    "tools/toml-test/decoder",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Nirvana-Jie <1357711537@qq.com>"]
repository = "https://github.com/tomlsmith/tomlsmith"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
rowan = "0.17.0"
serde_json = "1.0"
tempfile = "3.27.0"
text-size = "1.1.1"
thiserror = "2.0.20"
tomlsmith = { version = "0.3.1", path = "crates/tomlsmith" }
ungrammar = "1.16.1"

# Release binaries are latency-sensitive cold-start CLI/LSP entry points:
# fat LTO + a single codegen unit measurably cut parse-path time, and
# stripping symbols shrinks the binary the loader has to map.
# panic stays "unwind": tomlsmith-lsp relies on catch_unwind for
# request-level panic isolation.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
