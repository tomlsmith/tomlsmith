name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check generated syntax wrappers
        run: cargo run --package xtask -- codegen --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Check that Rowan is absent from the public API
        run: bash .github/scripts/check-rowan-api.sh

      # Library targets avoid the `tomlsmith` CLI binary colliding with the
      # public `tomlsmith` library's rustdoc output path.
      - name: Check documentation
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check release manifests and package contents
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq --exit-status --raw-output '.packages[] | select(.name == "tomlsmith") | .version')
          grep --fixed-strings "tomlsmith = { version = \"${version}\", path = \"crates/tomlsmith\" }" Cargo.toml
          cargo package --locked --package tomlsmith --no-verify
          cargo package --locked --package tomlsmith-cli --list > /dev/null
          cargo package --locked --package tomlsmith-lsp --list > /dev/null

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin every rustc/cargo invocation (including the cache action's probe)
      # to the MSRV so the 1.98.0 toolchain is never auto-installed here.
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the declared minimum Rust version
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check the workspace on the minimum Rust version
        run: cargo +1.85.0 check --workspace --all-targets --all-features

  wasm:
    name: WebAssembly compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain and WebAssembly target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Check the published core surface on WebAssembly
        run: cargo check --locked --package tomlsmith --target wasm32-unknown-unknown

  cross-platform:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        shell: bash

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-platform

      - name: Run Rust tests
        run: cargo test --workspace --all-features

  npm-cli:
    name: npm CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        shell: bash

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: npm-cli-${{ matrix.os }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install npm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check npm tooling
        run: pnpm npm:typecheck

      - name: Build, pack, install, and test the npm CLI
        run: pnpm npm:test

  toml-test:
    name: TOML conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.19.13
          cache: false

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: toml-test

      - name: Run TOML 1.0 and 1.1 conformance
        # Drop any cache-restored reports first so the uploaded artifact can
        # only contain reports produced by this run.
        run: |
          rm -rf target/toml-test/v2.2.0/reports
          bash tools/toml-test/run.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toml-test-reports
          path: target/toml-test/v2.2.0/reports/*.json
